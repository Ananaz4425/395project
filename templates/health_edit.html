{% extends "layout.html" %}
{% block title %}Edit Health Entry{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">✏️ Edit Health Entry</h1>
        <p class="page-subtitle">Update your record for {{ record['date'] }}.</p>
    </div>
</div>

<div class="form-card">
    <form action="/health/edit/{{ record['id'] }}" method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label>📅 Date</label>
                <input type="date" name="date" value="{{ record['date'] }}" required>
            </div>

            <div class="form-group">
                <label>🧠 Mood</label>
                <select name="mood" required>
                    {% for m in ['Great','Good','Okay','Bad'] %}
                    <option value="{{ m }}" {% if record['mood'] == m %}selected{% endif %}>{{ m }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>⚡ Energy Level</label>
                <select name="energy">
                    {% for e in ['High','Medium','Low'] %}
                    <option value="{{ e }}" {% if record['energy'] == e %}selected{% endif %}>{{ e }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>😴 Sleep Hours</label>
                <input type="number" name="sleep" step="0.5" value="{{ record['sleep_hours'] }}">
            </div>

            <div class="form-group">
                <label>💧 Water Intake (L)</label>
                <input type="number" name="water" step="0.1" value="{{ record['water_intake'] }}">
            </div>

            <div class="form-group">
                <label>🏃 Exercise</label>
                <input type="text" name="exercise" value="{{ record['exercise'] or '' }}">
            </div>
        </div>

        <div class="form-group form-group-full">
            <label>📝 Notes</label>
            <textarea name="notes" rows="3">{{ record['notes'] or '' }}</textarea>
        </div>

        <div class="form-actions">
            <a href="/health" class="btn btn-ghost">Cancel</a>
            <button type="submit" class="btn btn-primary">Update Entry ✓</button>
        </div>
    </form>
</div>
{% endblock %}
