{% extends "layout.html" %}
{% block title %}Add Affirmation{% endblock %}
{% block content %}
<div class="page-header"><div><h1 class="page-title">✦ New Affirmation</h1></div></div>
<div class="form-card">
    <form action="/affirmations/add" method="POST">
        <div class="form-group form-group-full">
            <label>💬 Affirmation Text</label>
            <textarea name="text" rows="3" placeholder="e.g. I am capable of achieving everything I set my mind to." required></textarea>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label>📁 Category</label>
                <select name="category">
                    {% for cat in ['Motivation','Health','Academic','Self-love','Resilience','Balance','Mental Health','General'] %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group" style="display:flex;align-items:center;gap:10px;padding-top:28px">
                <input type="checkbox" name="is_favorite" id="fav" style="width:auto">
                <label for="fav" style="margin:0;font-weight:500">⭐ Mark as Favorite</label>
            </div>
        </div>
        <div class="form-actions">
            <a href="/affirmations" class="btn btn-ghost">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Affirmation ✓</button>
        </div>
    </form>
</div>
{% endblock %}
