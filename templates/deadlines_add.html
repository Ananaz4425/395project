{% extends "layout.html" %}
{% block title %}Add Deadline{% endblock %}
{% block content %}
<div class="page-header">
    <div><h1 class="page-title">+ New Deadline</h1></div>
</div>
<div class="form-card">
    <form action="/deadlines/add" method="POST">
        <div class="form-grid">
            <div class="form-group form-group-full">
                <label>📌 Title</label>
                <input type="text" name="title" placeholder="e.g. Calculus Final Exam" required>
            </div>
            <div class="form-group">
                <label>📚 Subject / Category</label>
                <input type="text" name="subject" placeholder="e.g. Mathematics, CS, Personal">
            </div>
            <div class="form-group">
                <label>📅 Due Date</label>
                <input type="date" name="due_date" required>
            </div>
            <div class="form-group">
                <label>🔥 Priority</label>
                <select name="priority">
                    <option value="High">High</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
            <div class="form-group">
                <label>📊 Status</label>
                <select name="status">
                    <option value="Pending" selected>Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Done">Done</option>
                </select>
            </div>
        </div>
        <div class="form-group form-group-full">
            <label>📝 Notes</label>
            <textarea name="notes" rows="2" placeholder="Any extra details..."></textarea>
        </div>
        <div class="form-actions">
            <a href="/deadlines" class="btn btn-ghost">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Deadline ✓</button>
        </div>
    </form>
</div>
{% endblock %}
